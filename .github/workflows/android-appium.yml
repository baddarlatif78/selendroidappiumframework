name: Android Appium Tests
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  appium-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Appium and UiAutomator2
        run: |
          npm install -g appium
          appium driver install uiautomator2
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Create emulator
        uses: android-actions/avdmanager-create@v1
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
      - name: Start emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            adb devices
            npm install -g appium
            appium driver install uiautomator2
            (appium > appium.log 2>&1 &)
            for i in $(seq 1 30); do
              if curl -s http://127.0.0.1:4723/status >/dev/null; then break; fi
              sleep 2
            done
            mvn -B test
      - name: Upload TestNG and Extent reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-reports
          path: |
            test-output/**
            target/surefire-reports/**
            appium.log
          if-no-files-found: warn
