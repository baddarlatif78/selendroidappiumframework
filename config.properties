# Appium server
appium.server.url=http://127.0.0.1:4723
# Android device
platform.name=Android
automation.name=UiAutomator2
device.name=Android Emulator
# APK path is relative to project root. Override with -Dapp.path=/absolute/path/app.apk
app.path=selendroid-test-app.apk
app.package=io.selendroid.testapp
app.activity=io.selendroid.testapp.HomeScreenActivity
new.command.timeout=120
explicit.wait.seconds=15
# Report output folder
report.path=test-output/ExtentReport.html
